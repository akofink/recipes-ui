name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Cache generated recipes data
        uses: actions/cache@v4
        with:
          path: src/generated/
          key: ${{ runner.os }}-node-24-generated-${{ hashFiles('pnpm-lock.yaml', 'scripts/generate-static-data.js') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node-24-generated-${{ hashFiles('pnpm-lock.yaml', 'scripts/generate-static-data.js') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm run audit
      - name: Validate (typecheck, lint, format)
        run: pnpm run check
      - name: Test
        run: pnpm test
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build
