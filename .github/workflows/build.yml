name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Cache generated recipes data
        uses: actions/cache@v4
        with:
          path: src/generated/
          key: ${{ runner.os }}-node-24-generated-${{ hashFiles('package-lock.json', 'scripts/generate-static-data.js') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node-24-generated-${{ hashFiles('package-lock.json', 'scripts/generate-static-data.js') }}-
      - name: Install
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit
      - name: Validate (typecheck, lint, format)
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
